<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Audio visible avant + d'infos</title>

</head>
<body>

<details>
    <!-- Toujours visible AVANT de cliquer -->
    <summary>
        <span><strong>Titre de la piste</strong></span>
        <audio controls preload="none" src="vine-boom-meme_cCCpxZG.mp3" style="height: 32px; width: 200px;"></audio>
        <span class="more-info">+ d'infos</span>
    </summary>

    <!-- Affiché UNIQUEMENT après avoir cliqué sur "+ d'infos" -->
    <div class="details-content">
        <p>Artiste : Nom de l'artiste | Album : Nom de l'album (2024)</p>
        <p>Durée : 3m 20s | Genre : Rock</p>
    </div>
</details>

</body>
</html>
